    <!-- GitHub Pages SPA redirect: decode the path encoded by 404.html back into history -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?/ style redirect from 404.html
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          var path = decoded[0] ? decoded[0] : '';
          var query = decoded.slice(1).join('&');
          history.replaceState(null, null,
            l.pathname.slice(0, -1) + path +
            (query ? ('?' + query) : '') +
            l.hash
          );
        }
      })();
    </script>
